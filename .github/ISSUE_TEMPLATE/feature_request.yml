name: Feature request
description: Suggest an idea for Afterfeed
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Afterfeed has a deliberately small scope: a private, calm archive of your own memories. Sharing, social features and engagement mechanics are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
