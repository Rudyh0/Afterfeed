<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
    <title>Afterfeed</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      The splash lives in the page itself so it shows before any script loads.
      The app renders underneath it and removes it once the first screen,
      including its photos, is ready.
    -->
    <style>
      @font-face {
        font-family: 'Geist';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url(/fonts/geist-latin-wght-normal.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Geist';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url(/fonts/geist-latin-ext-wght-normal.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      :root {
        --splash-bg: #f4f5f7;
        --splash-fg: #17181c;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --splash-bg: #111214;
          --splash-fg: #f4f5f7;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --splash-bg: #111214;
        --splash-fg: #f4f5f7;
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        background: var(--splash-bg);
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--splash-bg);
        color: var(--splash-fg);
        transition: opacity 350ms ease;
      }
      #splash.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #splash svg {
        width: 220px;
        height: auto;
        overflow: visible;
      }
      #splash .fade {
        opacity: 0;
        animation: af-fade 260ms ease forwards;
      }
      #splash .d0 { animation-delay: 150ms; }
      #splash .d1 { animation-delay: 250ms; }
      #splash .d2 { animation-delay: 350ms; }
      #splash .r0 { animation-delay: 1200ms; }
      #splash .r1 { animation-delay: 1270ms; }
      #splash .r2 { animation-delay: 1340ms; }
      #splash .line {
        transform-origin: 49.6px 20px;
        transform: scaleX(0);
        animation: af-draw 400ms cubic-bezier(0.2, 0.8, 0.2, 1) 450ms forwards;
      }
      #splash .sun {
        transform: translateY(20px);
        animation: af-rise 550ms cubic-bezier(0.2, 0.8, 0.2, 1) 800ms forwards;
      }
      #splash .name {
        margin-top: 24px;
        font: 600 26px/1 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        letter-spacing: -0.02em;
        opacity: 0;
        transform: translateY(8px);
        animation: af-name 350ms cubic-bezier(0.2, 0.8, 0.2, 1) 1450ms forwards;
      }
      @keyframes af-fade { to { opacity: 1; } }
      @keyframes af-draw { to { transform: scaleX(1); } }
      @keyframes af-rise { to { transform: translateY(0); } }
      @keyframes af-name { to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) {
        #splash *,
        #splash .name {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 132 39" fill="currentColor">
        <defs>
          <clipPath id="af-sky"><rect x="60" y="-20" width="62" height="40" /></clipPath>
        </defs>
        <rect class="fade d0" x="0" y="18" width="12" height="4" rx="2" />
        <circle class="fade d1" cx="23.4" cy="20" r="3.4" />
        <circle class="fade d2" cx="38.2" cy="20" r="3.4" />
        <rect class="line" x="49.6" y="18" width="82.4" height="4" rx="2" />
        <g clip-path="url(#af-sky)"><path class="sun" d="M73 20V18a18 18 0 0 1 36 0v2z" /></g>
        <rect class="fade r0" x="74" y="25.8" width="34" height="2.4" rx="1.2" />
        <rect class="fade r1" x="79.5" y="30.8" width="23" height="2.4" rx="1.2" />
        <rect class="fade r2" x="85.5" y="35.8" width="11" height="2.4" rx="1.2" />
      </svg>
      <span class="name">Afterfeed</span>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
